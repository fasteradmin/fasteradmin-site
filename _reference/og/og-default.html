<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Inter";src:url("Inter-500.woff2") format("woff2");font-weight:500;font-style:normal}
@font-face{font-family:"Inter";src:url("Inter-600.woff2") format("woff2");font-weight:600;font-style:normal}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{font-family:"Inter",Arial,sans-serif;background:#fff;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:space-between;padding:76px 84px 70px;
  position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.rule{position:absolute;left:0;top:0;width:100%;height:10px;background:#0e2a44}
.logo{height:42px;width:auto;display:block}
h1{font-size:58px;font-weight:600;line-height:1.1;letter-spacing:-0.03em;color:#0e2a44;max-width:920px}
h1 .muted{color:#5a6b7a}
.bottom{width:100%;display:flex;align-items:center;gap:16px;
  border-top:1px solid #dfe4e9;padding-top:28px}
.dot{width:9px;height:9px;border-radius:999px;background:#e8760d;flex:none}
.qual{font-size:20px;font-weight:500;color:#5a6b7a}
.domain{margin-left:auto;font-size:20px;font-weight:600;color:#0a6fd1}
</style></head><body>
<div class="rule"></div>
<img class="logo" src="logo.png">
<h1>Get the work done,<br><span class="muted">without the hire you can't make.</span></h1>
<div class="bottom">
  <div class="dot"></div>
  <div class="qual">Operations systems for service companies of 20 to 50 people</div>
  <div class="domain">fasteradmin.com</div>
</div>
</body></html>
