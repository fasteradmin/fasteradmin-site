# Netlify configuration.
#
# This is a Next.js STATIC EXPORT (`output: "export"` in next.config.mjs).
# There is no server, no serverless function and no ISR. Do NOT install the
# Next.js Netlify plugin — it is for server-rendered Next and will fight the
# export. Netlify just serves the contents of out/ as files.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

  # This is a static export, not server-rendered Next. Skip Netlify's Next.js
  # Runtime so it does not fight the export.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

  # Netlify scans build output for the values of declared environment
  # variables and fails the build when it finds them. For NEXT_PUBLIC_ vars
  # that check is a false positive by construction: Next.js inlines them into
  # the browser bundle on purpose, so they are *supposed* to be in the output.
  # Listing them here tells the scanner they are public, without disabling
  # secret scanning entirely — a real secret leaking would still fail the build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FORM_ENDPOINT,NEXT_PUBLIC_AVAILABILITY_ENDPOINT,NEXT_PUBLIC_BOOKING_ENDPOINT,NEXT_PUBLIC_FA_TOKEN,NEXT_PUBLIC_TURNSTILE_SITE_KEY"

# ---------------------------------------------------------------------------
# Redirects
#
# The old Framer site is being replaced. Anything that existed there and does
# not exist here needs to resolve, or inbound links and any indexed URL 404.
# See REBUILD-NOTES.md for the full list of pages that were not rebuilt.
# ---------------------------------------------------------------------------

# /articles held four posts of leftover brand and web-design content, off the
# current positioning. The blog replaces it. 301 so any accumulated equity
# follows, rather than being thrown away.
[[redirects]]
  from = "/articles"
  to = "/learn/"
  status = 301
  force = true

[[redirects]]
  from = "/articles/*"
  to = "/learn/"
  status = 301
  force = true

# The blog shipped at /blog for a few hours on 2026-08-09 before being renamed
# to /learn. Both post URLs were in the sitemap in that window, so they may have
# been crawled. Splat preserves the slug: /blog/foo/ -> /learn/foo/.
[[redirects]]
  from = "/blog"
  to = "/learn/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/learn/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Voice-assistant pages. Decided 2026-08-08: all point at the homepage for now.
#
# Five were live on Framer at cutover: /voice-assistant, -restv2, -beautyv1,
# -book-meeting, and /voice-assistant-sc-gentle-clinics. That last one is
# reachable but absent from Framer's sitemap, so anything working off the
# sitemap alone would have missed it.
#
# The wildcard is deliberate: it catches per-clinic pages whether or not we
# knew they existed.
#
# WHEN THE COMBINED VOICE + WHATSAPP PAGE SHIPS, repoint the `to` below at it.
# A clinic prospect clicking their personalised link currently lands on a
# general automation homepage: survivable, not ideal.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/voice-assistant"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/voice-assistant*"
  to = "/"
  status = 301
  force = true

# Framer's own internal asset page. No equivalent here, but it is in the old
# sitemap so it may be indexed.
[[redirects]]
  from = "/image-library"
  to = "/"
  status = 301
  force = true
